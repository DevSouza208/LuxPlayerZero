<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lux · Prévia da programação TV Map</title><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/cinema-premium.css"><link rel="stylesheet" href="/cinema-polish.css"><link rel="stylesheet" href="/tvmap-guide.css"><style>body{margin:0;background:#050407;color:#f7f4ff;font-family:Outfit,Arial,sans-serif}main{padding:30px 4vw}.preview-note{color:#b9abc8;font-size:13px;margin:0 0 30px}#preview-click{margin-top:24px;color:#cbb9ff}</style></head><body class="cinema-shell"><main><p class="preview-note">LUX · PRÉVIA · Canais de teste sem reprodução. Os cards usam a fonte pública do TV Map.</p><div id="guide"></div><p id="preview-click" role="status"></p></main><script type="module">
import {createTvMapGuide} from '/tvmap-guide.js';
const names=['AXN','Band','Discovery Channel','Discovery Home & Health','Gazeta','Globo','HBO 2','Record TV','RedeTV!','SBT','Sony Channel','SporTV 2','Telecine Action','Telecine Cult','Telecine Fun','Telecine Pipoca','Telecine Premium','Telecine Touch','TNT','Warner Channel'];
const items=names.map((name,i)=>({id:'preview-'+i,name,group:'TV',url:'https://example.org/live/preview/test/'+i+'.m3u8'}));
const view=createTvMapGuide({onPlay:item=>{document.querySelector('#preview-click').textContent='Canal selecionado: '+item.name+'. Reprodução desativada nesta prévia.';}});document.querySelector('#guide').append(view.element);view.setChannels(items);view.show(true);
</script></body></html>
