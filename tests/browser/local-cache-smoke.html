<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lux · Validação do cache local</title><style>body{background:#08070e;color:#f7f4ff;font:17px system-ui;max-width:800px;margin:60px auto;padding:24px}button{background:#b38aff;border:0;border-radius:10px;padding:14px 20px;font:inherit}pre{white-space:pre-wrap;line-height:1.8;padding:24px;border:1px solid #56416d;border-radius:14px}small{color:#c1b9d1}</style><h1>Validação do cache local</h1><p>Dados sintéticos. Este teste não usa contas, playlists ou banco de produção.</p><button id="run">Executar testes</button><pre id="result" role="status">Aguardando execução.</pre><small>Verifica IndexedDB real, fila persistente e catálogo versionado no navegador.</small>
<script type="module">
import {createProfileStore} from '/profile-store.js';
import {localData} from '/local-data.js';
import {createLibraryCache,libraryCacheKey} from '/library-cache.js';
import {prepareCatalogText} from '/catalog-prepare.js';
const profileId='cache-smoke-demo',source='synthetic-source',catalogId='00000000-0000-4000-8000-000000000099';
const result=document.querySelector('#result'),button=document.querySelector('#run');
button.onclick=async()=>{
 button.disabled=true;const lines=[];const check=(ok,message)=>{if(!ok)throw Error(message);lines.push('✓ '+message);result.textContent=lines.join('\n')};
 const clean=async()=>{await localData.remove('profile:'+profileId);await localData.remove(await libraryCacheKey(profileId,source));await localData.remove('active-catalog:'+profileId)};
 let a,b;
 try{
  await clean();let posts=0,version=0,remote={};
  const fetcher=async(url,options={})=>{
   if(!options.body)return Response.json({profileId,version,value:remote});
   const body=JSON.parse(options.body);if(body.version!==version)return Response.json({error:'Conflict'},{status:409});
   posts++;remote=body.value;return Response.json({version:++version});
  };
  a=await createProfileStore(fetcher,{onStatus(){}});
  await a.write('recent',[{key:'episode:1',name:'Episódio de teste',group:'Teste',position:10,duration:600,at:Date.now()}]);
  await a.write('recent',[{key:'episode:1',name:'Episódio de teste',group:'Teste',position:50,duration:600,at:Date.now()}]);
  check(posts===0,'Progresso salvo localmente sem requisição ao servidor');
  check(Boolean((await localData.get('profile:'+profileId))?.ops),'Pendência confirmada no IndexedDB real');
  a.dispose();b=await createProfileStore(fetcher,{onStatus(){}});
  check(b.read('recent',[])[0].position===50,'Progresso restaurado após recriar o perfil');
  await b.flush();check(posts===1&&remote.recent[0].position===50&&!b.pending(),'Um único envio contém o progresso mais recente');
  b.dispose();let downloads=0,parses=0;
  const content='#EXTM3U\n#EXTINF:-1 group-title="Filmes",Filme sintético (2020)\nhttps://example.com/test.mp4\n';
  const load=createLibraryCache({fetcher:async()=>Response.json({schemaVersion:1,catalogId,contentVersion:'a'.repeat(64),itemCount:1,bytes:content.length})});
  const args={profileId,source,catalogId,download:async()=>{downloads++;return content},prepare:async text=>{parses++;return prepareCatalogText(text)}};
  await load(args);let restored=false;await load({...args,onCached:items=>restored=items[0].name==='Filme sintético (2020)'});
  check(restored&&downloads===1&&parses===1,'Mesma versão usa catálogo preparado sem download ou interpretação');
  check((await load.restore(profileId))?.items.length===1,'Catálogo recuperado do IndexedDB por perfil');
  check(await load.restore('another-profile')===null,'Outro perfil não recebe o catálogo salvo');
  await clean();check(true,'Dados sintéticos removidos; validação concluída');
 }catch(error){result.textContent=lines.join('\n')+'\n✗ '+error.message;}
 finally{a?.dispose();b?.dispose();button.disabled=false;}
};
</script></html>
