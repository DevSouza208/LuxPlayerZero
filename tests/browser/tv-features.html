<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prévia TV Lux · dados de teste</title><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/cinema-browse.css"><link rel="stylesheet" href="/lux-icons.css"><link rel="stylesheet" href="/tv-experience.css"><style>body{margin:0;background:#050508;color:#f7f4ff;font-family:Arial,sans-serif}.test-label{padding:15px 4vw;margin:0;color:#afa0c1;font-size:12px;border-bottom:1px solid #ffffff15}#browse-grid>button{border:1px solid #ffffff20;border-radius:12px;background:#16111e;color:#ddd1ed;min-height:85px;padding:14px;font:600 15px Arial;text-align:left}.browse-screen{padding-top:25px}.test-status{padding:0 4vw;color:#cbb9ff}</style></head><body class="cinema-shell"><p class="test-label">LUX · PRÉVIA DA TV · Canais e agenda de exemplo</p><main id="preview" class="browse-screen"><h1>Canais da sua playlist</h1><p id="count"></p><div id="browse-grid" class="browse-grid" data-role="tv"></div></main><p id="play-result" class="test-status" role="status"></p><script type="module">
import {createTvExperience} from '/tv-experience.js';
import {groupTvEntries} from '/cinema-tv-groups.js';
import {emptyTvSchedule} from '/tv-feature-model.js';
const entries=[['SporTV HD','sportv.br','Esportes'],['SporTV SD','sportv.br','Esportes'],['Canal de Notícias','news.br','Notícias'],['Globo','globo.br','TV aberta'],['HBO','hbo.br','Filmes'],['Discovery Channel','discovery.br','Documentários'],['EC: CANAL UNO','canaluno.ec','CANAIS INTERNACIONAIS'],['US: NBC','nbc.us','CANAIS INTERNACIONAIS'],['USA: ABC','abc.us','CANAIS INTERNACIONAIS'],['ARG: Canal Provincial','canal.ar','CANAIS INTERNACIONAIS'],['LA: Canal de Exemplo','latin.example','CANAIS INTERNACIONAIS']].map(([name,epgId,group],i)=>({id:'c'+i,name,epgId,group,url:'https://example.com/live/test/'+i+'.m3u8'}));
const groups=groupTvEntries(entries).groups;let saved=emptyTvSchedule();saved.days[3]=groups.slice(0,2).map(group=>({key:group.key,title:group.title}));
const memory=new Map();let tv;
const draw=()=>{const items=tv.channels();document.querySelector('#count').textContent=items.length+' canais disponíveis';const grid=document.querySelector('#browse-grid');grid.replaceChildren(...items.map(item=>{const button=document.createElement('button');button.textContent=item.name;button.onclick=()=>document.querySelector('#play-result').textContent='Canal selecionado: '+item.name;return button}))};
tv=createTvExperience({host:document.querySelector('#preview'),getProfileId:()=> 'tv-demo',storage:{get:async key=>memory.get(key),set:async(key,value)=>memory.set(key,value)},now:()=>new Date('2026-10-28T15:00:00Z'),fetcher:async(url,options={})=>{if(options.method==='POST')saved=JSON.parse(options.body).schedule;return Response.json({schedule:saved,canEdit:true})},onPlay:item=>{document.querySelector('#play-result').textContent='Canal selecionado: '+item.name},onDetails:item=>{document.querySelector('#play-result').textContent='Fontes de '+item.name},onFilterChange:draw});tv.setGroups(groups);tv.show(true);draw();
</script></body></html>
