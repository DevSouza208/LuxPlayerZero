<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV Lux · teste de categorias regionais</title><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/cinema-browse.css"><link rel="stylesheet" href="/lux-icons.css"><link rel="stylesheet" href="/tv-experience.css"><style>body{margin:0;background:#050508;color:#f7f4ff;font-family:Arial,sans-serif}.test-label{padding:15px 4vw;margin:0;color:#afa0c1;font-size:12px;border-bottom:1px solid #ffffff15}.browse-screen{padding-top:25px}#browse-grid>button{border:1px solid #ffffff20;border-radius:12px;background:#16111e;color:#ddd1ed;min-height:85px;padding:14px;font:600 15px Arial;text-align:left}.test-status{padding:0 4vw;color:#cbb9ff}</style></head><body class="cinema-shell"><p class="test-label">LUX · TESTE · API simulada com categorias regionais</p><main id="preview" class="browse-screen"><h1>Canais da sua playlist</h1><p id="count"></p><div id="browse-grid" class="browse-grid" data-role="tv"></div></main><p id="play-result" class="test-status" role="status"></p><script type="module">
import {createTvExperience} from '/tv-experience.js';import {groupTvEntries} from '/cinema-tv-groups.js';import {emptyTvSchedule} from '/tv-feature-model.js';import {createTvProviderCategoryClient} from '/tv-provider-categories.js';
const names=['Globo São Paulo HD','Globo Rio de Janeiro HD','Globo Porto Alegre HD','SporTV HD','US: NBC'];
const entries=names.map((name,i)=>({id:'c'+i,name,epgId:'channel.'+i,group:'CANAIS COMPLETO(SD,HD,FHD,4K)',url:'https://provider.example/live/demo/demo-password/'+(101+i)+'.m3u8'}));const groups=groupTvEntries(entries).groups;
const cats=[{category_id:'10',category_name:'GLOBO SUDESTE'},{category_id:'20',category_name:'GLOBO SUL'},{category_id:'30',category_name:'ESPORTES'},{category_id:'40',category_name:'INTERNACIONAIS'}];
const streams=names.map((name,i)=>({stream_id:101+i,name,category_id:i<2?'10':i===2?'20':i===3?'30':'40'}));const memory=new Map(),storage={get:async key=>memory.get(key),set:async(key,value)=>memory.set(key,value)};let saved=emptyTvSchedule();saved.days[3]=[{key:groups[0].key,title:groups[0].title}];let tv;
const draw=()=>{const items=tv.channels();document.querySelector('#count').textContent=items.length+' canais disponíveis';document.querySelector('#browse-grid').replaceChildren(...items.map(item=>{const node=document.createElement('button');node.textContent=item.name;node.onclick=()=>document.querySelector('#play-result').textContent='Selecionado: '+item.name;return node}))};
const providerClient=createTvProviderCategoryClient({storage,profileId:()=> 'regional-demo',read:async url=>JSON.stringify(new URL(url).searchParams.get('action')==='get_live_categories'?cats:streams)});
tv=createTvExperience({host:document.querySelector('#preview'),storage,providerClient,getProviderSource:()=>'',getProfileId:()=> 'regional-demo',now:()=>new Date('2026-10-28T15:00:00Z'),fetcher:async(url,options={})=>{if(options.method==='POST')saved=JSON.parse(options.body).schedule;return Response.json({schedule:saved,canEdit:true})},onPlay:item=>document.querySelector('#play-result').textContent='Selecionado: '+item.name,onDetails:item=>document.querySelector('#play-result').textContent='Fontes de '+item.name,onFilterChange:draw});tv.setGroups(groups);tv.show(true);draw();
</script></body></html>
