<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guia e esportes · Lux</title><link rel="stylesheet" href="/account/account.css"><script type="module" src="/guide/guide.js"></script><link rel="stylesheet" href="/connectivity.css"><script type="module" src="/connectivity.js"></script><link rel="stylesheet" href="/lux-icons.css">
</head><body><header><a href="/cinema/"><svg class="lux-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg><span>Voltar ao Lux</span></a><a href="/account/"><svg class="lux-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg><span>Sua conta</span></a></header><main><h1>O que vem a seguir</h1><p>Programação fornecida pela sua fonte e eventos cadastrados com referência pública.</p><p id="feedback" role="status"></p><form id="filters"><label>Dia<input id="date" type="date" required></label><label>Canal (ID do EPG)<input id="channel" maxlength="160" placeholder="Todos os canais"></label><label>Buscar programa<input id="query" maxlength="100" type="search"></label><button><svg class="lux-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg><span>Consultar</span></button></form><h2>Guia de programação</h2><div id="programs" aria-live="polite"></div><h2>Esportes</h2><div id="sports"></div><h2>Seus lembretes</h2><p>Alertas aparecem enquanto esta página estiver aberta.</p><div id="reminders"></div><section id="admin" hidden><h2>Atualizar programação</h2><form id="xml-form"><label>Arquivo XMLTV autorizado<input id="xml" type="file" accept=".xml,.xmltv" required></label><button><svg class="lux-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg><span>Importar programação</span></button><p id="import-status" role="status"></p></form><h3>Cadastrar evento esportivo confirmado</h3><form id="sports-form"><label>Confronto / título<input name="title" maxlength="200" required></label><label>Esporte<input name="sport" maxlength="60" required></label><label>Competição<input name="competition" maxlength="120" required></label><label>Início (horário deste dispositivo)<input name="start" type="datetime-local" required></label><label>Fonte pública do evento<input name="sourceUrl" type="url" placeholder="https://…" required></label><label>Canais confirmados (separados por vírgula)<input name="channels" maxlength="1000"></label><label><input name="transmissionConfirmed" type="checkbox"> Conferi a transmissão na fonte informada</label><button><svg class="lux-icon" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg><span>Salvar evento</span></button></form></section></main></body></html>
