<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Guia e esportes · Lux</title><link rel="stylesheet" href="/account/account.css"><script type="module" src="/guide/guide.js"></script><link rel="stylesheet" href="/connectivity.css"><script type="module" src="/connectivity.js"></script><link rel="stylesheet" href="/lux-icons.css">
</head><body><header><a href="/cinema/">Voltar ao Lux</a><a href="/account/">Sua conta</a></header><main><h1>O que vem a seguir</h1><p>Programação fornecida pela sua fonte e eventos cadastrados com referência pública.</p><p id="feedback" role="status"></p><form id="filters"><label>Dia<input id="date" type="date" required></label><label>Canal (ID do EPG)<input id="channel" maxlength="160" placeholder="Todos os canais"></label><label>Buscar programa<input id="query" maxlength="100" type="search"></label><button>Consultar</button></form><h2>Guia de programação</h2><div id="programs" aria-live="polite"></div><h2>Esportes</h2><div id="sports"></div><h2>Seus lembretes</h2><p>Alertas aparecem enquanto esta página estiver aberta.</p><div id="reminders"></div><section id="admin" hidden><h2>Atualizar programação</h2><form id="xml-form"><label>Arquivo XMLTV autorizado<input id="xml" type="file" accept=".xml,.xmltv" required></label><button>Importar programação</button><p id="import-status" role="status"></p></form><h3>Cadastrar evento esportivo confirmado</h3><form id="sports-form"><label>Confronto / título<input name="title" maxlength="200" required></label><label>Esporte<input name="sport" maxlength="60" required></label><label>Competição<input name="competition" maxlength="120" required></label><label>Início (horário deste dispositivo)<input name="start" type="datetime-local" required></label><label>Fonte pública do evento<input name="sourceUrl" type="url" placeholder="https://…" required></label><label>Canais confirmados (separados por vírgula)<input name="channels" maxlength="1000"></label><label><input name="transmissionConfirmed" type="checkbox"> Conferi a transmissão na fonte informada</label><button>Salvar evento</button></form></section></main></body></html>
