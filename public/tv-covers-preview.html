<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Capas Lux TV · Prévia</title><link rel="stylesheet" href="/home.css"><link rel="stylesheet" href="/cinema-browse.css"><link rel="stylesheet" href="/lux-icons.css"><link rel="stylesheet" href="/tv-experience.css"><style>body{margin:0;background:#050508;color:#f7f4ff;font-family:Arial,sans-serif}.test-label{padding:15px 4vw;margin:0;color:#b9aac9;font-size:12px;border-bottom:1px solid #ffffff15}.test-label a{color:#d3bfff;margin-left:20px}#browse-grid>button{border:1px solid #ffffff20;border-radius:12px;background:#16111e;color:#ddd1ed;min-height:85px;padding:14px;font:600 15px Arial;text-align:left}.cover-gallery{padding:30px 4vw;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:22px}.cover-gallery figure{margin:0}.cover-gallery img{display:block;width:100%;border-radius:12px}.cover-gallery figcaption{font-size:13px;margin-top:8px;color:#baacc9}</style></head><body class="cinema-shell"><p class="test-label">LUX · PRÉVIA DAS CAPAS · Ilustrações locais e fontes de teste sem reprodução<a href="?gallery=1">Ver todas as capas</a><a href="?">Ver navegação</a></p><main id="preview" class="browse-screen"><div class="browse-heading"><h1>Canais da sua playlist</h1><p id="count"></p></div><div id="browse-grid" class="browse-grid" data-role="tv"></div></main><script type="module">
import {createTvExperience} from '/tv-experience.js';import {groupTvEntries} from '/cinema-tv-groups.js';import {TV_FOLDER_COVERS} from '/tv-folder-covers.js';
if(new URLSearchParams(location.search).has('gallery')){document.querySelector('#preview').remove();const gallery=document.createElement('section');gallery.className='cover-gallery';gallery.setAttribute('aria-label','Galeria de todas as capas');for(const [title,url]of [['Todos os canais',TV_FOLDER_COVERS.all],...Object.entries(TV_FOLDER_COVERS.groups),...Object.entries(TV_FOLDER_COVERS.subgroups)]){const figure=document.createElement('figure'),image=document.createElement('img'),caption=document.createElement('figcaption');image.src=url;image.alt=title.replace('␟',' / ');caption.textContent=image.alt;figure.append(image,caption);gallery.append(figure)}document.body.append(gallery)}else{
const asset=await (await fetch('/data/tv-channel-groups.json')).json(),selected=new Map();for(const row of asset.canais)if(row.visivel&&!['Outros','Rádios','Informações da lista'].includes(row.grupo)){const key=row.grupo+'|'+row.subgrupo;if(!selected.has(key))selected.set(key,row)}const entries=[...selected.values()].map((row,i)=>({id:'preview-'+i,name:row.nome,group:'CANAIS COMPLETO',epgId:'preview-'+i,url:'https://example.org/live/preview/test/'+row.id+'.m3u8'}));let tv;const draw=()=>{const items=tv.channels();document.querySelector('#count').textContent=items.length+' canais de teste';document.querySelector('#browse-grid').replaceChildren(...items.map(item=>{const node=document.createElement('button');node.textContent=item.name;return node}))};tv=createTvExperience({host:document.querySelector('#preview'),guest:true,onFilterChange:draw});tv.setGroups(groupTvEntries(entries).groups);tv.show(true);draw();}
</script></body></html>
