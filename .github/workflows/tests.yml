name: Lux Zero - testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check public/app.js
          node --check public/login.js
          node --check public/login-logic.js
          node --check public/playlist.js
          node --check public/cinema-app.js
          node --check public/cinema-title.js
          node --check public/cinema-browse.js
          node --check public/cinema-series.js
          node --check public/cinema-tv-groups.js
          node --check public/cinema-detail-page.js
          node --check public/cinema-player-ui.js
          node --check public/media-taxonomy.js
          node --check public/tv-normalizer.js
          node --check public/lux-tag-palette.js
          node --check src/auth-core.js
          node --check src/library-core.js
          node --check functions/_middleware.js
          node --check src/worker.js
      - name: Testes unitários
        run: npm test
