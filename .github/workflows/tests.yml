name: Lux Zero - testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validar sintaxe
        run: |
          node --check public/app.js
          node --check public/login.js
          node --check public/login-logic.js
          node --check public/playlist.js
          node --check src/worker.js
      - name: Testes unitários
        run: npm test
