name: Lux Zero - testes
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validar sintaxe
        run: find src public functions -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Testes unitários e integração SQLite
        run: npm test
      - name: Instalar navegador de teste
        run: |
          npm install --no-save --package-lock=false playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Testar login, perfis e catálogo no navegador
        run: node scripts/browser-smoke.cjs
      - name: Capturas para revisão visual
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lux-interface-screenshots
          path: test-results/
          if-no-files-found: ignore
